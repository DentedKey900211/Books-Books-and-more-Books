<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- ========== LIBRARY VIEW ========== -->
  <div id="library-view">
    <header>
      <div class="header-ornament">❧</div>
      <h1>Biblioteca</h1>
      <p class="subtitle">Colección de Obras Escogidas</p>
      <div class="header-rule"></div>
    </header>

    <main class="shelf-container">
      <div class="shelf" id="shelf"></div>
    </main>

    <footer>
      <span>Est. MMXXIV</span>
      <span class="dot">·</span>
      <span>Omnia Libri Porta Sunt</span>
    </footer>
  </div>

  <!-- ========== BOOK READER VIEW ========== -->
  <div id="reader-view" class="hidden">
    <button id="back-btn" onclick="closeBook()">
      <span>←</span> Volver a la Biblioteca
    </button>

    <div class="book-wrapper">
      <div class="book" id="book">
        <!-- Left page -->
        <div class="page page-left" id="page-left">
          <div class="page-inner">
            <div class="page-header">
              <span class="book-title-top" id="left-book-title"></span>
            </div>
            <div class="page-content" id="left-content">
              <canvas id="left-pdf-canvas" class="pdf-canvas hidden"></canvas>
            </div>
            <div class="page-footer">
              <span class="page-num" id="left-page-num"></span>
            </div>
          </div>
          <div class="spine-shadow"></div>
        </div>

        <!-- Right page -->
        <div class="page page-right" id="page-right">
          <div class="page-inner">
            <div class="page-header">
              <span class="book-title-top" id="right-book-title"></span>
            </div>
            <div class="page-content" id="right-content">
              <canvas id="right-pdf-canvas" class="pdf-canvas hidden"></canvas>
            </div>
            <div class="page-footer">
              <span class="page-num" id="right-page-num"></span>
            </div>
          </div>
          <!-- Click zone to turn page -->
          <div class="turn-zone" id="turn-zone" onclick="turnPage()">
            <div class="turn-hint" id="turn-hint">
              <span>›</span>
            </div>
          </div>
        </div>

        <!-- Spine -->
        <div class="book-spine"></div>
      </div>

      <!-- Page turn animation overlay -->
      <div class="page-turning" id="page-turning"></div>
    </div>

    <div class="reader-nav">
      <button class="nav-btn" id="prev-btn" onclick="prevPage()">‹ Anterior</button>
      <span class="progress-text" id="progress-text"></span>
      <button class="nav-btn" id="next-btn" onclick="turnPage()">Siguiente ›</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
